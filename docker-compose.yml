services:
  nour2-simulation:
    build:
      context: .
      dockerfile: Dockerfile.nour2
    container_name: nour2_smart_home
    ports:
      - "8889:8888"
      - "8766:8766"
    networks:
      - moodsim-network
    restart: always

  backend:
    build:
      context: ./MoodSimBackend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    networks:
      - moodsim-network
    volumes:
      - ./simulation_logs:/app/simulation_logs

  frontend:
    build:
      context: ./moodsim
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8086:3000"
    depends_on:
      - backend
    networks:
      - moodsim-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  moodsim-network:
    driver: bridge
