services:
  backend:
    build:
      context: ./MoodSimBackend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    networks:
      - moodsim-network
    volumes:
      - ./simulation_logs:/app/simulation_logs

  frontend:
    build:
      context: ./moodsim
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://host.docker.internal:5000/api
    networks:
      - moodsim-network
    # This makes host.docker.internal work on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  moodsim-network:
    driver: bridge